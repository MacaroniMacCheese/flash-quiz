                        <details class="w-full border border-gray-200 rounded-2xl bg-white shadow-sm"><summary class="flex items-center justify-between gap-3 p-5 sm:p-6 min-h-[56px]"><h3 class="font-semibold text-base sm:text-lg">Detailed Breakdown</h3><div class="flex items-center gap-2 sm:gap-3"><div class="text-right"><div class="text-[10px] sm:text-xs text-gray-500 uppercase tracking-wider">Accuracy</div><div class="text-base sm:text-lg font-medium leading-none">${e.toFixed(0)}%</div></div><svg viewBox="0 0 32 32" class="w-8 h-8 sm:w-10 sm:h-10 transform -rotate-90 rounded-full"><circle r="15.9155" cx="16" cy="16" fill="transparent" stroke="#fca5a5" stroke-width="32"></circle><circle r="15.9155" cx="16" cy="16" fill="transparent" stroke="#22c55e" stroke-width="32" stroke-dasharray="${e} 100"></circle></svg><svg class="chev w-5 h-5 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></summary><div class="px-5 pb-5 sm:px-6 sm:pb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${state.questionStats.map((E,B)=>`
                                    <div class="p-4 sm:p-5 ${E.isCorrect?"bg-green-50 border-l-4 border-green-500":"bg-red-50 border-l-4 border-red-500"} rounded-r-xl text-sm space-y-2 break-words whitespace-normal shadow-sm"><div class="font-medium text-gray-900 mb-2">Q${B+1}: ${escapeHTML(E.question)}</div>
                                        ${E.isCorrect?`<div class="text-green-700 font-medium">Answered: ${escapeHTML(E.correctAnswer)}</div>`:`<div class="text-red-700">Answered: <span class="line-through opacity-75">${escapeHTML(E.userAnswer||"(blank)")}</span></div><div class="text-green-700 font-medium mt-1">Correct: ${escapeHTML(E.correctAnswer)}</div>`}

                                        ${E.info?`
                                            <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="mt-3 flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-black transition-colors uppercase tracking-wider outline-none">
                                                ${icons.infoCircle} Toggle Info
                                            </button><div class="hidden mt-2 text-blue-900 text-xs sm:text-sm bg-blue-100/60 p-3 rounded-lg leading-relaxed border border-blue-200/50 whitespace-pre-wrap">${escapeHTML(E.info)}</div>
                                        `:""}
                                    </div>
                                `).join("")}
                            </div></details></div></div>
            `},render=()=>{const e=document.getElementById("app"),t=`${state.appState}:${state.currentIndex}`;t!==state.lastView&&!state.feedbackState&&(window.scrollTo(0,0),state.lastView=t),state.appState==="setup"?(e.innerHTML=renderSetup(),state.tab==="qr"&&(state.qr.text.trim()&&!state.qr.parts.length&&!state.qr.error?qrBuild():qrShow())):state.appState==="quiz"?(e.innerHTML=renderQuiz(),state.feedbackState||setTimeout(()=>{const r=document.getElementById("identInput");r&&r.focus()},10)):state.appState==="results"&&(e.innerHTML=renderResults())};document.addEventListener("keydown",e=>{if(e.key==="Enter"&&state.appState==="quiz"&&state.feedbackState){if(e.preventDefault(),e.repeat||Date.now()-state.feedbackShownAt<300)return;window.goToNextQuestion()}}),render(),"serviceWorker"in navigator&&/^https?:$/.test(location.protocol)&&window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
